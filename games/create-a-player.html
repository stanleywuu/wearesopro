<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta data-include="/partials/title.html">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; upgrade-insecure-requests">
  <link rel="preload" href="/assets/css/style.css" as="style" fetchpriority="high">
  <link rel="stylesheet" href="/assets/css/critical.css?v=1">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/games/assets/css/create-a-player.css">
  <script defer src="/assets/js/main.js"></script>
  <script defer src="/games/assets/js/create-a-player.data.js"></script>
  <script defer src="/games/assets/js/create-a-player.draw.js"></script>
  <script defer src="/games/assets/js/create-a-player.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="brand"><a href="/index.html"><span class="logo">🧊🏒</span> We Are So Pro</a></div>
    <div data-include="/partials/nav.html"></div>
  </header>
  <noscript>
    <div data-include="/partials/nav-noscript.html"></div>
  </noscript>

  <main class="layout">
    <div data-include="/partials/sidebar.html"></div>

    <section class="content">
      <section class="article">
        <h1>Create A Player</h1>
        <p class="muted">Build your own beer leaguer. Pick a shape, squash it, colour it, name it. <span class="muted">(Drag the player to spin them around)</span></p>
      </section>

      <div class="cap-wrap">
        <div class="cap-stage">
          <p id="cap-bubble" class="cap-bubble" hidden></p>
          <canvas id="cap-canvas" tabindex="0" aria-label="Your created hockey player, drag to rotate"></canvas>
          <p id="cap-caption" class="cap-caption" aria-live="polite"></p>
          <div class="cap-actions">
            <button type="button" id="cap-random" class="button">Randomize</button>
            <button type="button" id="cap-save" class="button">Save</button>
            <button type="button" id="cap-export" class="button">Download</button>
          </div>
          <p id="cap-status" class="cap-status" aria-live="polite"></p>
        </div>

        <div class="cap-controls">
          <div class="cap-tabs" role="tablist" aria-label="Player options">
            <button class="cap-tab" role="tab" id="tab-shape" aria-controls="panel-shape" data-tab="shape">Shape</button>
            <button class="cap-tab" role="tab" id="tab-kit" aria-controls="panel-kit" data-tab="kit">Kit</button>
            <button class="cap-tab" role="tab" id="tab-info" aria-controls="panel-info" data-tab="info">Info</button>
          </div>

          <div class="cap-panel" id="panel-shape" role="tabpanel" aria-labelledby="tab-shape" data-panel="shape">
            <fieldset class="cap-group">
              <legend>Body</legend>
              <div class="cap-opts" data-options="bodyShape" data-list="shapes"></div>
              <label class="cap-slot"><span>Width</span><input type="range" data-param="bodyWidth"></label>
              <label class="cap-slot"><span>Height</span><input type="range" data-param="bodyHeight"></label>
              <label class="cap-slot"><span>Contour</span><input type="range" data-param="bodyContour"></label>
            </fieldset>

            <fieldset class="cap-group">
              <legend>Head</legend>
              <div class="cap-opts" data-options="headShape" data-list="shapes"></div>
              <label class="cap-slot"><span>Width</span><input type="range" data-param="headWidth"></label>
              <label class="cap-slot"><span>Height</span><input type="range" data-param="headHeight"></label>
              <label class="cap-slot"><span>Contour</span><input type="range" data-param="headContour"></label>
            </fieldset>
          </div>

          <div class="cap-panel" id="panel-kit" role="tabpanel" aria-labelledby="tab-kit" data-panel="kit">
            <fieldset class="cap-group">
              <legend>Colours</legend>
              <div class="cap-slot"><span>Jersey</span><div class="cap-swatches" data-swatch="jerseyColor" data-palette="jerseyColors"></div></div>
              <div class="cap-slot"><span>Lettering</span><div class="cap-swatches" data-swatch="trimColor" data-palette="trimColors"></div></div>
              <div class="cap-slot"><span>Socks</span><div class="cap-swatches" data-swatch="sockColor" data-palette="jerseyColors"></div></div>
              <div class="cap-slot"><span>Skin</span><div class="cap-swatches" data-swatch="skinColor" data-palette="skinColors"></div></div>
            </fieldset>

            <fieldset class="cap-group">
              <legend>Helmet</legend>
              <div class="cap-slot"><span>Colour</span><div class="cap-swatches" data-swatch="helmetColor" data-palette="helmetColors"></div></div>
              <div class="cap-slot"><span>Face</span><div class="cap-opts" data-options="helmetStyle" data-list="helmets"></div></div>
            </fieldset>
          </div>

          <div class="cap-panel" id="panel-info" role="tabpanel" aria-labelledby="tab-info" data-panel="info">
            <fieldset class="cap-group">
              <legend>Player</legend>
              <label class="cap-slot"><span>Name</span><input type="text" id="cap-name" maxlength="14" autocomplete="off"></label>
              <label class="cap-slot"><span>Number</span><input type="text" id="cap-number" maxlength="2" inputmode="numeric" autocomplete="off"></label>
              <label class="cap-slot"><span>Position</span><select id="cap-position"></select></label>
              <div class="cap-slot"><span>Shoots</span><div class="cap-opts" data-options="handedness" data-list="handedness"></div></div>
            </fieldset>

            <fieldset class="cap-group">
              <legend>Catch-phrase</legend>
              <label class="cap-slot"><span>Says</span><input type="text" id="cap-phrase" maxlength="48" autocomplete="off" placeholder="What do they always say?"></label>
              <label class="cap-slot"><span>Or pick</span><select id="cap-phrase-preset"></select></label>
            </fieldset>
          </div>
        </div>
      </div>

    </section>

  </main>

  <div data-include="/partials/footer.html"></div>
</body>
</html>
